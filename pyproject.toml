[project]
name = "godot-visual-mcp"
version = "1.4.0"
description = "A secure, offline-first MCP server for Godot asset prototyping."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastmcp>=2.0,<3.0",
  "Pillow>=10.0,<12.0",
  "httpx>=0.27,<1.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9.0",
  "pytest-asyncio>=0.23,<1.0",
  "ruff>=0.8,<1.0",
  "mypy>=1.13,<2.0",
]
ai = [
  "rembg>=2.0,<3.0",
]

[dependency-groups]
dev = [
  "pytest>=8.0,<9.0",
  "pytest-asyncio>=0.23,<1.0",
  "ruff>=0.8,<1.0",
  "mypy>=1.13,<2.0",
]

[project.scripts]
godot-visual-mcp = "server.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.setuptools.package-data]
godot_visual_mcp = ["resources/palettes/*.json", "resources/workflows/*.json"]
