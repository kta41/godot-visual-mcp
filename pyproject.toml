[project]
name = "godot-visual-mcp"
version = "1.5.0"
description = "A secure, offline-first MCP server for Godot asset prototyping."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Kta41" }]
keywords = ["godot", "mcp", "pixel-art", "asset-pipeline"]
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "fastmcp>=3.2.0,<5.0",
  "Pillow>=12.3.0,<13.0",
  "httpx>=0.27,<1.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<10.0",
  "pytest-asyncio>=0.23,<2.0",
  "ruff>=0.8,<1.0",
  "mypy>=1.13,<2.0",
]
ai = [
  "rembg>=2.0,<3.0",
]

[project.urls]
Homepage = "https://github.com/kta41/godot-visual-mcp"
Repository = "https://github.com/kta41/godot-visual-mcp"
Issues = "https://github.com/kta41/godot-visual-mcp/issues"

[dependency-groups]
dev = [
  "pytest>=8.0,<10.0",
  "pytest-asyncio>=0.23,<2.0",
  "ruff>=0.8,<1.0",
  "mypy>=1.13,<2.0",
]

[project.scripts]
godot-visual-mcp = "server.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.setuptools.package-data]
godot_visual_mcp = ["resources/palettes/*.json", "resources/workflows/*.json"]
