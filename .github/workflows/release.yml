name: Release

on:
  pull_request:
    types: [closed]
    branches:
      - main

permissions:
  contents: write
  id-token: write
  packages: write

jobs:
  prepare:
    name: Prepare release version
    if: >
      github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.ref == 'develop'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
      - id: version
        run: echo "version=$(uv run --no-dev python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')" >> "$GITHUB_OUTPUT"

  artifacts:
    name: Build release artifacts
    needs: prepare
    if: needs.prepare.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.merge_commit_sha }}
      - uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true
      - run: uv sync --frozen
      - run: uv build --out-dir dist
      - name: Validate wheel installation
        run: |
          uv venv --python 3.11 release-venv
          uv pip install --python release-venv/bin/python --no-deps dist/*.whl
          release-venv/bin/python -c "import godot_visual_mcp; assert godot_visual_mcp.__version__ == '${{ needs.prepare.outputs.version }}'"
      - name: Generate checksums
        run: sha256sum dist/* > dist/SHA256SUMS
      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          path: .
          artifact-name: SBOM.spdx.json
          output-file: dist/SBOM.spdx.json
      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-artifacts
          path: dist/

  publish-pypi:
    name: Publish to PyPI
    needs: [prepare, artifacts]
    if: needs.prepare.result == 'success' && needs.artifacts.result == 'success'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/godot-visual-mcp
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-artifacts
          path: dist
      - uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
      - run: uv publish dist/*.whl dist/*.tar.gz

  publish-ghcr:
    name: Publish Docker image
    needs: [prepare, artifacts]
    if: needs.prepare.result == 'success' && needs.artifacts.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ needs.prepare.outputs.version }}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  github-release:
    name: Create GitHub release
    needs: [prepare, artifacts]
    if: needs.prepare.result == 'success' && needs.artifacts.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.merge_commit_sha }}
      - uses: actions/download-artifact@v4
        with:
          name: python-artifacts
          path: dist
      - name: Create release with generated notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v${{ needs.prepare.outputs.version }}"
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" dist/* --generate-notes --target "${{ github.event.pull_request.merge_commit_sha }}"
