name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  id-token: write
  packages: write

jobs:
  artifacts:
    name: Build release artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: true
      - name: Verify tag matches package version
        run: |
          test "v$(uv run --no-dev python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')" = "${GITHUB_REF_NAME}"
      - run: uv sync --frozen
      - run: uv build --out-dir dist
      - name: Validate wheel installation
        run: |
          uv venv --python 3.11 release-venv
          uv pip install --python release-venv/bin/python --no-deps dist/*.whl
          release-venv/bin/python -c "import godot_visual_mcp; assert godot_visual_mcp.__version__ == '${GITHUB_REF_NAME#v}'"
      - name: Generate checksums
        run: sha256sum dist/* > dist/SHA256SUMS
      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          path: .
          artifact-name: SBOM.spdx.json
          output-file: dist/SBOM.spdx.json
      - name: Upload release artifacts
        uses: actions/upload-artifact@v6
        with:
          name: python-artifacts
          path: dist/

  publish-pypi:
    name: Publish to PyPI
    needs: artifacts
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/godot-visual-mcp
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-artifacts
          path: dist
      - uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
      - run: uv publish dist/*.whl dist/*.tar.gz

  publish-ghcr:
    name: Publish Docker image
    needs: artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  github-release:
    name: Create GitHub release
    needs: artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: python-artifacts
          path: dist
      - name: Create release with generated notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --generate-notes --verify-tag
